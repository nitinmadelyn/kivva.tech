name: Deploy to beta.selvelnxt.com

on:
  push:
    branches:
      - beta

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run webbuild:beta # Adjust for your framework

      # ✅ Deploy to S3 with proper Cache-Control headers
      - name: Deploy to S3
        uses: jakejarvis/s3-sync-action@master
        with:
          args: >-
            --delete
            --exact-timestamps
            --cache-control "public,max-age=31536000,immutable"
            --exclude "index.html"
            --exclude "service-worker.js"
        env:
          AWS_S3_BUCKET: beta.selvelnxt.com
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          SOURCE_DIR: ./dist


      # ✅ Upload index.html with no-cache (important for React/SPA)
      - name: Upload index.html with no-cache
        run: |
          aws s3 cp ./dist/index.html s3://beta.selvelnxt.com/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html" \
            --region ${{ secrets.AWS_REGION }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # ✅ CloudFront Invalidation
      - name: Invalidate CloudFront Cache
        uses: chetan/invalidate-cloudfront-action@v2
        env:
          AWS_REGION: ap-south-1
          DISTRIBUTION: E1I58GLO0T3GYV
          PATHS: "/*"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
